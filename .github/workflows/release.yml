name: Release
# Publishing a GitHub release builds every platform and attaches the
# downloads to it. Run it by hand with a tag to rebuild an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. v0.1.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build universal Pad2Go.app
        run: |
          ARCHS="arm64 amd64" VERSION="${TAG#v}" packaging/build-macos-app.sh dist
          packaging/build-macos-dmg.sh dist/Pad2Go.app "pad2go-$TAG-macos-universal.dmg"
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: pad2go-*.dmg

  # The WinUHid driver is built here, from the upstream commit pinned below,
  # because the WDK and MSBuild only run on Windows. The MSI is bundled into the
  # installer by the windows job. Bump the ref to take a newer upstream commit.
  winuhid:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          path: pad2go
      - uses: actions/checkout@v5
        with:
          repository: cgutman/WinUHid
          ref: d6cebbef5c7909168d1f881185be8f607d6aefd4
          path: winuhid-src
      - uses: microsoft/setup-msbuild@v2
      - name: Install the Windows Driver Kit
        run: choco install windowsdriverkit11 -y --no-progress
      - name: Build WinUHid driver and MSI
        shell: pwsh
        working-directory: pad2go
        run: packaging/windows/build-winuhid.ps1 -Source ../winuhid-src -Out ../winuhid/winuhid.msi
      - uses: actions/upload-artifact@v5
        with:
          name: winuhid
          path: winuhid/winuhid.msi

  windows:
    needs: winuhid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      # Signing goes through SignPath (free for open source) and runs only once
      # the SIGNPATH_API_TOKEN secret and SIGNPATH_ORGANIZATION_ID variable exist.
      # The SignPath project needs the slugs "pad2go" with artifact configurations
      # "exe" (a zip holding pad2go.exe) and "installer" (the setup .exe), and a
      # signing policy "release-signing".
      - name: Cross-compile pad2go.exe
        run: VERSION="${TAG#v}" packaging/build-windows.sh "$PWD/dist"
      - name: Upload unsigned pad2go.exe
        id: unsigned-exe
        if: vars.SIGNPATH_ORGANIZATION_ID
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-exe
          path: dist/pad2go.exe
      - name: Sign pad2go.exe
        if: vars.SIGNPATH_ORGANIZATION_ID
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: pad2go
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe
      - name: Use signed pad2go.exe
        if: vars.SIGNPATH_ORGANIZATION_ID
        run: cp signed-exe/pad2go.exe dist/pad2go.exe
      - name: Zip pad2go.exe
        run: (cd dist && zip -9 "../pad2go-$TAG-windows-amd64.zip" pad2go.exe)
      - uses: actions/download-artifact@v6
        with:
          name: winuhid
          path: winuhid
      - name: Build installer (bundles ViGEmBus and WinUHid)
        run: VERSION="${TAG#v}" packaging/build-windows-installer.sh dist/pad2go.exe "pad2go-$TAG-windows-amd64-setup.exe" winuhid/winuhid.msi
      - name: Upload unsigned installer
        id: unsigned-installer
        if: vars.SIGNPATH_ORGANIZATION_ID
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-installer
          path: pad2go-*-setup.exe
      - name: Sign installer
        if: vars.SIGNPATH_ORGANIZATION_ID
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: pad2go
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer
      - name: Use signed installer
        if: vars.SIGNPATH_ORGANIZATION_ID
        run: cp signed-installer/*-setup.exe .
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            pad2go-*.zip
            pad2go-*-setup.exe

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    # 22.04's glibc keeps the binary running on Debian 12 and newer.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/packaging/linux
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${TAG#v}" -o dist/pad2go ./cmd/pad2go
          cp packaging/pad2go.png packaging/linux/pad2go.desktop dist/
          tar -C dist -czf "pad2go-$TAG-linux-${{ matrix.arch }}.tar.gz" pad2go pad2go.png pad2go.desktop
      - uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.arch }}
          path: pad2go-*.tar.gz

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum pad2go-* > SHA256SUMS
          gh release upload "$TAG" pad2go-* SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
