name: CI
on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'bench/python/**', 'bench/results/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'bench/python/**', 'bench/results/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per platform: setup (the slow part) runs once, then lint, test and
  # build reuse its module and build caches. Each platform has its own BLE,
  # virtual pad and window code, so all three run every step.
  ci:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: go.mod is tidy
        if: runner.os == 'Linux'
        run: go mod tidy -diff
      - name: Vet (default and optional build tags)
        run: |
          go vet ./...
          go vet -tags nowebview,nobluetooth ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14

      # The race detector runs on Linux and macOS; on Windows it doubles the
      # test time and the code it would cover is shared.
      - name: Test
        run: go test ${{ runner.os != 'Windows' && '-race' || '' }} ./...

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: go build -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dist/pad2go ./cmd/pad2go
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: go build -ldflags "-s -w -H windowsgui -X main.version=${GITHUB_SHA::7}" -o dist/pad2go.exe ./cmd/pad2go
      - name: Build (macOS app)
        if: runner.os == 'macOS'
        run: |
          VERSION="${GITHUB_SHA::7}" packaging/build-macos-app.sh dist
          ditto -c -k --keepParent dist/Pad2Go.app dist/Pad2Go.app.zip
          rm -rf dist/Pad2Go.app
      - uses: actions/upload-artifact@v5
        with:
          name: pad2go-${{ runner.os }}
          path: dist/
          retention-days: 7
