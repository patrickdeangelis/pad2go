name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Each platform has its own files (BLE, virtual pad, window chrome).
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: go.mod is tidy
        shell: bash
        run: go mod tidy -diff
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: go test -race ./...

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build tags compile
        shell: bash
        run: |
          go build -tags nowebview ./...
          go build -tags nobluetooth ./...
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dist/pad2go ./cmd/pad2go
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${GITHUB_SHA::7}" -o dist/pad2go.exe ./cmd/pad2go
      - name: Build (macOS app)
        if: runner.os == 'macOS'
        run: |
          VERSION="${GITHUB_SHA::7}" packaging/build-macos-app.sh dist
          ditto -c -k --keepParent dist/Pad2Go.app dist/Pad2Go.app.zip
          rm -rf dist/Pad2Go.app
      - uses: actions/upload-artifact@v5
        with:
          name: pad2go-${{ runner.os }}
          path: dist/
          retention-days: 7
