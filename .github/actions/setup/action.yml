name: Set up pad2go build
description: Go from go.mod (with module and build caches) plus each platform's window build dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        # Keyed on this file too, so a change to the CI layout saves a fresh
        # cache that holds everything one job builds (vet, race tests, build).
        cache-dependency-path: |
          go.sum
          .github/actions/setup/action.yml
    - name: Linux window dependencies (cached)
      if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: libgtk-3-dev libwebkit2gtk-4.1-dev
        version: 1
    - name: Linux pkg-config alias
      if: runner.os == 'Linux'
      shell: bash
      # webview_go asks for webkit2gtk-4.0; this alias maps it to 4.1.
      run: echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/packaging/linux" >> "$GITHUB_ENV"
    - name: Windows WebView2 header shim
      if: runner.os == 'Windows'
      shell: bash
      run: echo "CGO_CXXFLAGS=-I$(cygpath -m "$GITHUB_WORKSPACE")/packaging/windows/include" >> "$GITHUB_ENV"
