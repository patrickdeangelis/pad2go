name: Set up pad2go build
description: Go from go.mod (with module and build caches) plus each platform's window build dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        # Keyed on this file too, so a change to the CI layout saves a fresh
        # cache that holds everything one job builds (vet, race tests, build).
        cache-dependency-path: |
          go.sum
          .github/actions/setup/action.yml
    - name: Refresh APT package index
      if: runner.os == 'Linux'
      shell: bash
      # The runner image's index can name package versions the mirror has
      # already dropped (404), and the cache step below does not always refresh it.
      run: sudo apt-get update -q
    - name: Linux window dependencies (cached)
      if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: libgtk-3-dev libwebkit2gtk-4.1-dev
        version: 1
    - name: Check Linux window dependencies
      if: runner.os == 'Linux'
      shell: bash
      # cache-apt-pkgs-action reports success (and caches nothing) when apt
      # fails; stop here with a clear message instead of a cgo error later.
      run: |
        pkg-config --exists gtk+-3.0 webkit2gtk-4.1 || {
          echo "::error::GTK/WebKitGTK dev packages are missing: the apt install failed. Delete the cache-apt-pkgs_* cache before re-running."
          exit 1
        }
    - name: Linux pkg-config alias
      if: runner.os == 'Linux'
      shell: bash
      # webview_go asks for webkit2gtk-4.0; this alias maps it to 4.1.
      run: echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/packaging/linux" >> "$GITHUB_ENV"
    - name: Windows WebView2 header shim
      if: runner.os == 'Windows'
      shell: bash
      run: echo "CGO_CXXFLAGS=-I$(cygpath -m "$GITHUB_WORKSPACE")/packaging/windows/include" >> "$GITHUB_ENV"
